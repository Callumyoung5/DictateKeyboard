name: Build DictateKeyboard APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag to build (e.g., v1.0). Leave blank for latest main.'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version_tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-APK
          path: app/build/outputs/apk/debug/*.apk
